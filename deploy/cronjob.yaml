apiVersion: batch/v1
kind: CronJob
metadata:
  name: knvb-ical
spec:
  schedule: "17 6,18 * * *"
  timeZone: Europe/Amsterdam
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # The client already retries; a failed run waits for the next schedule.
      backoffLimit: 0
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: knvb-ical
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          enableServiceLinks: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: knvb-ical
              image: ghcr.io/tiesmaster/knvb-matches-to-ical
              env:
                - name: SOURCE
                  value: live
                - name: TEAM_ID
                  value: T1779014083
                - name: CAL_NAME
                  value: Neptunus-Schiebroek O8-1
                - name: ONLY_OWN_TEAM
                  value: "false"
                - name: INCLUDE_PAST
                  value: "false"
                - name: DEFAULT_DURATION
                  value: 1h
                - name: LOG_LEVEL
                  value: info
              envFrom:
                - secretRef:
                    name: knvb-ical
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 500m
                  memory: 128Mi
