# TEMPLATE — replace the placeholders, then encrypt BEFORE committing:
#   sops --encrypt --in-place deploy/secret.sops.yaml
# (creation rules in /.sops.yaml). Flux needs `decryption: {provider: sops}`
# on the Kustomization that points at this directory.
apiVersion: v1
kind: Secret
metadata:
  name: knvb-ical
type: Opaque
stringData:
  KNVB_USER: CHANGEME
  KNVB_PASS: CHANGEME
  KNVB_CLIENT_ID: CHANGEME
  KNVB_CLIENT_SECRET: CHANGEME
  R2_ACCOUNT_ID: CHANGEME
  R2_ACCESS_KEY_ID: CHANGEME
  R2_SECRET_ACCESS_KEY: CHANGEME
  R2_BUCKET: CHANGEME
  # The random path segment is the only access control on the feed URL.
  R2_OBJECT_KEY: CHANGEME-random-segment/neptunus-o8-1.ics
  # Optional ntfy topic URL; leave empty to disable notifications.
  NOTIFY_URL: ""
